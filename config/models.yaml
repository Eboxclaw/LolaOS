# LOLA model registry (ADR-006, ADR-019).
# Every entry is loadable by the nano-RIPL layer behind the same two slots;
# profiles in memory.yaml declare which PAIR is resident per device.
# Runtime floor: llama.cpp b11960+ (GGUF metadata) — see docs/NANO_RIPL.md.
models:
  # --- omni pair (laptop profile default) -------------------------------
  - model_id: d1-omni-2b
    gguf_file: d1-Omni-2B-Q8_0.gguf
    sha256: TODO-S2c-verify
    repository: LiquidAI/d1-Omni-2B-GGUF
    role: decision
    modality: omni            # text + image + video + audio questions
    quantization: q8_0        # no 4-bit exists today (risk register, NANO_RIPL.md)
    backend: reference-llamacpp
    context_limit: 131072
    est_ram_mb: 1850
    mmproj: mmproj-d1-Omni-2B-Q8_0.gguf   # verified: projector ships as Q8_0
  - model_id: lfm3-omni-2b
    gguf_file: LFM3-Omni-2B-Q4_K_M.gguf
    sha256: TODO-S2c-verify
    repository: LiquidAI/LFM3-Omni-2B-GGUF
    role: agent
    modality: omni            # text + image + video + audio in; text/speech out
    quantization: q4_k_m
    backend: reference-llamacpp
    context_limit: 32768      # omni ceiling
    est_ram_mb: 1100
    mmproj: mmproj-LFM3-Omni-2B-Q8_0.gguf # verified: projector ships as Q8_0
  # --- text pair (constrained profile fallback; same slots) -------------
  - model_id: d1-2b
    gguf_file: d1-2B-Q4_K_M.gguf
    sha256: TODO-S2c-verify
    repository: LiquidAI/d1-2B-GGUF
    role: decision
    modality: text
    quantization: q4_k_m
    backend: reference-llamacpp
    context_limit: 131072
    est_ram_mb: 1100
  - model_id: lfm3-1.7b
    gguf_file: LFM3-1.7B-Q4_K_M.gguf
    sha256: TODO-S2c-verify
    repository: LiquidAI/LFM3-1.7B-GGUF
    role: agent
    modality: text
    quantization: q4_k_m
    backend: reference-llamacpp
    context_limit: 262144
    est_ram_mb: 1050
registered:
  - { model_id: lfm3-vl-2b,     repository: LiquidAI/LFM3-VL-2B-GGUF,     role: specialist, modality: text, quantization: q4_k_m, backend: none, context_limit: 131072, est_ram_mb: 1100 }
  - { model_id: lfm3-audio-2b,  repository: LiquidAI/LFM3-Audio-2B-GGUF,  role: specialist, modality: text, quantization: q4_k_m, backend: none, context_limit: 32768,  est_ram_mb: 1100 }
  - { model_id: lfm3-1.7b-base, repository: LiquidAI/LFM3-1.7B-Base,      role: specialist, modality: text, quantization: bf16,   backend: none, context_limit: 262144, est_ram_mb: 4000 }

# LiquidCodec (~74M streaming codec; ships inside the Audio/Omni GGUF
# releases). Encoder+decoder are LFM3 blocks — our K1–K3 kernels cover
# them (K9, ADR-035). Decoder-only QAT makes Q4_0 3.5x smaller with
# minimal quality loss.
codecs:
  - codec_id: liquidcodec
    repository: LiquidAI/LFM3-Omni-2B-GGUF
    quantizations: [q4_0, q4_k_m, q8_0]
    default_quantization: q4_0
    est_ram_mb: 80
