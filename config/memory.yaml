# Memory layer configuration (docs/MEMORY.md, ADR-007/ADR-009/ADR-019).
# Profiles declare a model PAIR for the two slots; the residency planner
# verifies the pair fits the RAM budget (decision slot never downgraded).
active_profile: laptop

profiles:
  laptop:
    description: "Modern laptop: omni pair resident (~3 GB weights; decision slot is prefill-only so its KV is transient)."
    ram_budget_mb: 8192
    pair:
      decision: d1-omni-2b
      agent: lfm3-omni-2b
  constrained:
    description: "Small laptop / Android-class device: text pair behind the same slots; omni when d1-Omni ships a 4-bit quant."
    ram_budget_mb: 3072
    pair:
      decision: d1-2b
      agent: lfm3-1.7b

ttl:
  # Days before bulky payloads are compacted to blobs/summaries.
  # Rows and hashes are always kept; only payloads move.
  model_payloads_days: 30
  session_bulk_days: 90
  feature_snapshots_days: 180
  # Data classes never compacted or deleted.
  immutable: [decision_runs, decision_outcomes, paper_orders, paper_fills, risk_checks, graph_nodes]
