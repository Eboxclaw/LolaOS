[workspace]
resolver = "2"
members = [
    "crates/lola-core",
    "crates/lola-infer",
    "crates/lola-venue",
    "crates/lola-replay",
    "crates/lola-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Proprietary"
authors = ["LOLA"]

[workspace.dependencies]
lola-core = { path = "crates/lola-core" }
lola-infer = { path = "crates/lola-infer" }
lola-venue = { path = "crates/lola-venue" }
lola-replay = { path = "crates/lola-replay" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled-full"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7"] }
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
parquet = { version = "54", features = ["arrow"] }
arrow = "54"

[profile.release]
lto = "thin"
strip = true
